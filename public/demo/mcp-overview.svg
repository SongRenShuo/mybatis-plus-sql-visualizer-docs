<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920">
  <!-- MCP 演示占位图：GIF 录制前临时使用，录制后由 mcp.gif + mcp.png 替换 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="920" fill="url(#bg)"/>
  <rect x="24" y="24" width="1232" height="872" rx="16" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="640" y="88" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="40" font-weight="700" fill="#1e293b">SQL Visualizer · MCP Server</text>
  <text x="640" y="128" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22" fill="#64748b">给 AI Agent 的确定性 SQL 工具 —— 十个只读工具，证据而非置信度</text>

  <!-- 左：外部 agent -->
  <g font-family="system-ui, 'Segoe UI', sans-serif">
    <text x="210" y="196" text-anchor="middle" font-size="20" font-weight="600" fill="#475569">外部 Agent</text>
    <g font-size="20" fill="#334155">
      <rect x="80" y="216" width="260" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="210" y="249" text-anchor="middle">Claude Code</text>
      <rect x="80" y="282" width="260" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="210" y="315" text-anchor="middle">Cursor</text>
      <rect x="80" y="348" width="260" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="210" y="381" text-anchor="middle">JetBrains AI Assistant</text>
      <rect x="80" y="414" width="260" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="210" y="447" text-anchor="middle">Junie</text>
    </g>
  </g>

  <!-- 中：连接 -->
  <g stroke="#3b82f6" stroke-width="3" fill="none" stroke-dasharray="8 6">
    <path d="M 340 242 C 420 242, 440 320, 520 330"/>
    <path d="M 340 308 C 420 308, 440 330, 520 342"/>
    <path d="M 340 374 C 420 374, 440 356, 520 354"/>
    <path d="M 340 440 C 420 440, 440 382, 520 366"/>
  </g>
  <circle cx="430" cy="298" r="34" fill="#3b82f6"/>
  <text x="430" y="308" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#ffffff">MCP</text>

  <!-- 右：IDE -->
  <g font-family="system-ui, 'Segoe UI', sans-serif">
    <rect x="520" y="216" width="680" height="200" rx="12" fill="#1e293b"/>
    <rect x="520" y="216" width="680" height="44" rx="12" fill="#0f172a"/>
    <circle cx="548" cy="238" r="7" fill="#f87171"/>
    <circle cx="572" cy="238" r="7" fill="#fbbf24"/>
    <circle cx="596" cy="238" r="7" fill="#34d399"/>
    <text x="860" y="245" text-anchor="middle" font-size="18" fill="#94a3b8">IntelliJ IDEA（2025.2+ 内置 MCP Server）</text>
    <text x="560" y="300" font-size="24" font-weight="600" fill="#ffffff">SQL Visualizer 插件</text>
    <text x="560" y="338" font-size="19" fill="#cbd5e1">渲染链 · 数据源 · 执行计划 · 校验器</text>
    <g font-size="17" fill="#93c5fd">
      <text x="560" y="386">mpsv_* 十工具注册进平台 MCP Server</text>
      <text x="920" y="386" fill="#64748b">SELECT 白名单 · 零弹窗 · 审计留痕</text>
    </g>
  </g>

  <!-- 下：工具三组 -->
  <g font-family="system-ui, 'Segoe UI', sans-serif">
    <!-- 拿 SQL -->
    <rect x="80" y="470" width="360" height="380" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="80" y="470" width="360" height="56" rx="12" fill="#3b82f6"/>
    <text x="260" y="506" text-anchor="middle" font-size="22" font-weight="600" fill="#ffffff">拿 SQL</text>
    <g font-size="19" fill="#334155">
      <text x="108" y="564" font-family="Consolas, monospace" font-weight="600" fill="#1d4ed8">mpsv_render_sql</text>
      <text x="108" y="592" fill="#64748b" font-size="17">文件+行号 / XML 片段 → 可执行 SQL</text>
      <text x="108" y="636" font-family="Consolas, monospace" font-weight="600" fill="#1d4ed8">mpsv_render_logs</text>
      <text x="108" y="664" fill="#64748b" font-size="17">控制台日志还原真实参数 SQL</text>
      <text x="108" y="708" font-family="Consolas, monospace" font-weight="600" fill="#1d4ed8">mpsv_crud_sql</text>
      <text x="108" y="736" fill="#64748b" font-size="17">实体类 → CRUD 四件套</text>
      <text x="108" y="780" font-family="Consolas, monospace" font-weight="600" fill="#1d4ed8">mpsv_reverse_sql</text>
      <text x="108" y="808" fill="#64748b" font-size="17">SQL → MyBatis-Plus 代码</text>
    </g>

    <!-- 看库 -->
    <rect x="460" y="470" width="360" height="380" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="460" y="470" width="360" height="56" rx="12" fill="#0ea5e9"/>
    <text x="640" y="506" text-anchor="middle" font-size="22" font-weight="600" fill="#ffffff">看库</text>
    <g font-size="19" fill="#334155">
      <text x="488" y="564" font-family="Consolas, monospace" font-weight="600" fill="#0369a1">mpsv_schema_context</text>
      <text x="488" y="592" fill="#64748b" font-size="17">表名白名单 → 表列注释上下文</text>
      <text x="488" y="636" font-family="Consolas, monospace" font-weight="600" fill="#0369a1">mpsv_explain</text>
      <text x="488" y="664" fill="#64748b" font-size="17">七方言 EXPLAIN + notices</text>
      <text x="488" y="700" fill="#64748b" font-size="17">+ index hints 建议</text>
    </g>

    <!-- 执行前把关 -->
    <rect x="840" y="470" width="360" height="380" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="840" y="470" width="360" height="56" rx="12" fill="#10b981"/>
    <text x="1020" y="506" text-anchor="middle" font-size="22" font-weight="600" fill="#ffffff">执行前把关</text>
    <g font-size="19" fill="#334155">
      <text x="868" y="564" font-family="Consolas, monospace" font-weight="600" fill="#047857">mpsv_check_sql</text>
      <text x="868" y="592" fill="#64748b" font-size="17">静态写风险与类型核查</text>
      <text x="868" y="636" font-family="Consolas, monospace" font-weight="600" fill="#047857">mpsv_mapper_check</text>
      <text x="868" y="664" fill="#64748b" font-size="17">契约核查 + simulate 实证</text>
      <text x="868" y="708" font-family="Consolas, monospace" font-weight="600" fill="#047857">mpsv_rollback_plan</text>
      <text x="868" y="736" fill="#64748b" font-size="17">回滚预案，只产出不执行</text>
      <text x="868" y="780" font-family="Consolas, monospace" font-weight="600" fill="#047857">mpsv_perf_advice</text>
      <text x="868" y="808" fill="#64748b" font-size="17">20 条规则性能建议</text>
    </g>
  </g>

  <text x="640" y="886" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="17" fill="#94a3b8">演示占位图 · 动图录制中，功能详见「MCP Server 工具」页</text>
</svg>
