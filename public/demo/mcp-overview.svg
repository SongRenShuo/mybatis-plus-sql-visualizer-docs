<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="960" viewBox="0 0 1080 960">
  <title>SQL Visualizer · MCP Server：十一个只读工具按 agent 工作流分三组——拿 SQL、看库、执行前把关</title>
  <desc>外部 agent（Claude Code / Cursor / JetBrains AI Assistant / Codex / ZCode / DeepSeek Harness）经 MCP 连到 IDEA 内置 MCP Server，调用插件注册的十一个 sqlv_* 工具；工具全部只读、幂等、非破坏性，连库入口只收 SELECT，全程零弹窗并留审计记录。</desc>
  <!-- SQL Visualizer MCP Server 官方配图（features/mcp.md 中英两页共用）
       口径来源 features/mcp.md：十一工具 5/2/4 分组、只读·幂等·非破坏性、查询白名单只收 SELECT、
       全程零弹窗、审计留痕 [MCP-AUDIT]、IDEA 2025.2+ 内置 MCP Server。
       字号策略（2026-10-12 第二轮）：站点正文列把图显示在约 800px 宽，画布 1080 即缩放约 74%。
       本图横向余量实测每列尚有 50px 上下，故这一轮不动画布、直接把字号整体上调——工具名 19→20.5、
       描述 17→19.5、分组标题 22→24、主标题 36→38、agent 名 15.5→17，描述文字的实际显示尺寸
       由约 12.6px 提到约 14.4px（与 comparison-routes.svg 重排后的正文同级）。
       为何画布不再收窄：最长的工具名 sqlv_history_search（19 字符 mono）在 20.5px 下已占 214px，
       加上图标缩进与内边距，单列下限约 280px；三列并排的横向下限约 1000px，再收就只能缩字号，得不偿失。
       版式：强分组标题条（步骤编号 + 计数徽标）+ 每项线性图标 + 窗口框代表 IDE + 安全属性独立成条。 -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0.5 1 L 9 5 L 0.5 9 z" fill="#b6c2d1"/>
    </marker>
  </defs>

  <rect width="1080" height="960" fill="url(#page)"/>
  <rect x="24" y="24" width="1032" height="912" rx="20" fill="#ffffff" stroke="#e6ebf2"/>

  <g font-family="system-ui, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">

    <!-- ================= 标题区 ================= -->
    <text x="540" y="86" text-anchor="middle" font-size="38" font-weight="700" fill="#0f172a">SQL Visualizer · MCP Server</text>
    <text x="540" y="124" text-anchor="middle" font-size="20" fill="#64748b">给 AI Agent 的确定性 SQL 工具 —— 证据而非置信度</text>

    <!-- ================= 连接流程 ================= -->
    <text x="56" y="176" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="1.5">连接方式</text>

    <!-- ① 外部 agent（6 个 · 2 列 × 3 行） -->
    <g filter="url(#soft)">
      <rect x="56" y="192" width="390" height="158" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    </g>
    <text x="78" y="224" font-size="18" font-weight="600" fill="#0f172a">外部 AGENT</text>
    <g font-size="17" fill="#475569">
      <circle cx="86" cy="256" r="5.5" fill="#d97757"/><text x="104" y="262">Claude Code</text>
      <circle cx="86" cy="288" r="5.5" fill="#8b5cf6"/><text x="104" y="294">AI Assistant</text>
      <circle cx="86" cy="320" r="5.5" fill="#2563eb"/><text x="104" y="326">ZCode</text>
      <circle cx="252" cy="256" r="5.5" fill="#2563eb"/><text x="270" y="262">Cursor</text>
      <circle cx="252" cy="288" r="5.5" fill="#10a37f"/><text x="270" y="294">Codex</text>
      <circle cx="252" cy="320" r="5.5" fill="#4d6bfe"/><text x="270" y="326">DeepSeek Harness</text>
    </g>

    <path d="M 446 262 L 470 262" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- ② MCP -->
    <g filter="url(#soft)">
      <svg x="480" y="228" width="64" height="64" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="180" height="180" rx="24" fill="black"/>
        <mask id="mcp-official-mask" style="mask-type:luminance" maskUnits="userSpaceOnUse" x="7" y="7" width="166" height="166">
          <path d="M173 7H7V173H173V7Z" fill="white"/>
        </mask>
        <g mask="url(#mcp-official-mask)">
          <path d="M23.5996 85.2532L86.2021 22.6507C94.8457 14.0071 108.86 14.0071 117.503 22.6507C126.147 31.2942 126.147 45.3083 117.503 53.9519L70.2254 101.23" stroke="white" stroke-width="11.0667" stroke-linecap="round"/>
          <path d="M70.8789 100.578L117.504 53.952C126.148 45.3083 140.163 45.3083 148.806 53.952L149.132 54.278C157.776 62.9216 157.776 76.9357 149.132 85.5792L92.5139 142.198C89.6327 145.079 89.6327 149.75 92.5139 152.631L104.14 164.257" stroke="white" stroke-width="11.0667" stroke-linecap="round"/>
          <path d="M101.853 38.3013L55.553 84.6011C46.9094 93.2447 46.9094 107.258 55.553 115.902C64.1966 124.546 78.2106 124.546 86.8543 115.902L133.154 69.6025" stroke="white" stroke-width="11.0667" stroke-linecap="round"/>
        </g>
      </svg>
    </g>
    <text x="512" y="314" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">MCP</text>

    <path d="M 552 262 L 576 262" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- ③ IDE（窗口框） -->
    <g filter="url(#soft)">
      <rect x="586" y="192" width="438" height="158" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <path d="M 586 204 a 12 12 0 0 1 12 -12 h 414 a 12 12 0 0 1 12 12 v 26 h -438 z" fill="#f1f5f9"/>
      <line x1="586" y1="230" x2="1024" y2="230" stroke="#e2e8f0"/>
      <circle cx="608" cy="211" r="5.5" fill="#f87171"/>
      <circle cx="626" cy="211" r="5.5" fill="#fbbf24"/>
      <circle cx="644" cy="211" r="5.5" fill="#34d399"/>
    </g>
    <text x="676" y="216" font-size="16.5" font-weight="600" fill="#334155">IntelliJ IDEA 2025.2+ · 内置 MCP Server</text>
    <text x="610" y="272" font-size="22" font-weight="600" fill="#0f172a">SQL Visualizer 插件</text>
    <rect x="822" y="252" width="176" height="27" rx="13.5" fill="#eff6ff"/>
    <text x="910" y="271" text-anchor="middle" font-size="15.5" fill="#2563eb">注册 <tspan font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace">sqlv_*</tspan> 十一工具</text>
    <text x="610" y="312" font-size="17" fill="#475569">agent 直接调用渲染链 / 数据源 / 执行计划能力</text>
    <text x="610" y="336" font-size="17" fill="#475569">你在 IDE 里照常写代码，两边互不打扰</text>

    <!-- ================= 安全边界（独立成条） ================= -->
    <g filter="url(#soft)">
      <rect x="56" y="374" width="968" height="54" rx="12" fill="#f8fafc" stroke="#e8edf4"/>
    </g>
    <g fill="#475569" font-size="16.5">
      <path d="M 82 394 l 4.5 4.5 L 94 391" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="106" y="407">只读 · 幂等 · 非破坏性</text>
      <path d="M 306 394 l 4.5 4.5 L 318 391" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="330" y="407">连库入口只收 SELECT</text>
      <path d="M 530 394 l 4.5 4.5 L 542 391" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="554" y="407">全程零弹窗</text>
      <path d="M 690 394 l 4.5 4.5 L 702 391" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="714" y="407">审计留痕 <tspan font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" fill="#0f172a">[MCP-AUDIT]</tspan></text>
    </g>

    <!-- ================= 工具三组 ================= -->
    <text x="56" y="468" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="1.5">十一个工具 · 按 agent 工作流分组</text>

    <!-- ① 拿 SQL -->
    <g filter="url(#card)">
      <rect x="56" y="486" width="313" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <path d="M 56 500 a 14 14 0 0 1 14 -14 h 285 a 14 14 0 0 1 14 14 v 42 h -313 z" fill="#eff6ff"/>
      <line x1="56" y1="542" x2="369" y2="542" stroke="#bfdbfe" stroke-width="2"/>
    </g>
    <circle cx="86" cy="521" r="13" fill="#2563eb"/>
    <text x="86" y="526" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">1</text>
    <text x="110" y="528" font-size="24" font-weight="700" fill="#1d4ed8">拿 SQL</text>
    <rect x="306" y="508" width="46" height="26" rx="13" fill="#ffffff"/>
    <text x="329" y="526" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2563eb">5</text>

    <g stroke="#2563eb" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M88 572h5l3 3v8a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1z"/><path d="M91 579h4M91 582h4"/>
      <path d="M88 636h11v9h-11z"/><path d="M91 639l2 2-2 2M96 643h2.5"/>
      <path d="M88 700h11v9h-11z"/><path d="M88 704h11M92 704v5"/>
      <path d="M93 763l-3 4 3 4M98 763l3 4-3 4"/>
      <circle cx="94" cy="763" r="3.6"/><path d="M97 766l3.4 3.4"/>
    </g>
    <g font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="20.5" font-weight="600" fill="#1d4ed8">
      <text x="116" y="581">sqlv_render_sql</text>
      <text x="116" y="645">sqlv_render_logs</text>
      <text x="116" y="709">sqlv_crud_sql</text>
      <text x="116" y="773">sqlv_reverse_sql</text>
      <text x="116" y="837">sqlv_history_search</text>
    </g>
    <g font-size="19.5" fill="#64748b">
      <text x="116" y="606">位置 / 片段 → 可执行 SQL</text>
      <text x="116" y="670">日志还原真实参数 SQL</text>
      <text x="116" y="734">实体类 → CRUD 四件套</text>
      <text x="116" y="798">SQL → Java 代码</text>
      <text x="116" y="862">历史 SQL 四维检索</text>
    </g>

    <!-- ② 看库 -->
    <g filter="url(#card)">
      <rect x="383" y="486" width="313" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <path d="M 383 500 a 14 14 0 0 1 14 -14 h 285 a 14 14 0 0 1 14 14 v 42 h -313 z" fill="#e0f2fe"/>
      <line x1="383" y1="542" x2="696" y2="542" stroke="#bae6fd" stroke-width="2"/>
    </g>
    <circle cx="413" cy="521" r="13" fill="#0284c7"/>
    <text x="413" y="526" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">2</text>
    <text x="437" y="528" font-size="24" font-weight="700" fill="#0369a1">看库</text>
    <rect x="633" y="508" width="46" height="26" rx="13" fill="#ffffff"/>
    <text x="656" y="526" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0284c7">2</text>

    <g stroke="#0284c7" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="417" cy="576" rx="5.5" ry="2.4"/><path d="M411.5 576v7.5c0 1.3 2.5 2.4 5.5 2.4s5.5-1.1 5.5-2.4V576"/><path d="M411.5 580c0 1.3 2.5 2.4 5.5 2.4s5.5-1.1 5.5-2.4"/>
      <path d="M412 645v-4M416.5 645v-7M421 645v-10M411 645h11"/>
    </g>
    <g font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="20.5" font-weight="600" fill="#0369a1">
      <text x="443" y="581">sqlv_schema_context</text>
      <text x="443" y="645">sqlv_explain</text>
    </g>
    <g font-size="19.5" fill="#64748b">
      <text x="443" y="606">表列结构 / 类型 / 注释</text>
      <text x="443" y="670">单条 SELECT → 执行计划</text>
    </g>
    <text x="443" y="724" font-size="17" fill="#94a3b8">连库类工具需已配置数据源</text>

    <!-- ③ 执行前把关 -->
    <g filter="url(#card)">
      <rect x="710" y="486" width="313" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <path d="M 710 500 a 14 14 0 0 1 14 -14 h 285 a 14 14 0 0 1 14 14 v 42 h -313 z" fill="#ecfdf5"/>
      <line x1="710" y1="542" x2="1023" y2="542" stroke="#a7f3d0" stroke-width="2"/>
    </g>
    <circle cx="740" cy="521" r="13" fill="#059669"/>
    <text x="740" y="526" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">3</text>
    <text x="764" y="528" font-size="24" font-weight="700" fill="#047857">执行前把关</text>
    <rect x="960" y="508" width="46" height="26" rx="13" fill="#ffffff"/>
    <text x="983" y="526" text-anchor="middle" font-size="15.5" font-weight="700" fill="#059669">4</text>

    <g stroke="#059669" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M747 572l5 2v5c0 3-2.2 4.6-5 5.5-2.8-.9-5-2.5-5-5.5v-5z"/><path d="M745 579l1.6 1.6 3-3.1"/>
      <path d="M747 635h5l3 3v8a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1z"/><path d="M750 642l1.5 1.5 3-3"/>
      <path d="M746 703a5.5 5.5 0 1 0 2-4.2"/><path d="M746 694.5v4h4"/>
      <path d="M742 766a5.5 5.5 0 0 1 11 0"/><path d="M747.5 766l3-3.2"/>
    </g>
    <g font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="20.5" font-weight="600" fill="#047857">
      <text x="770" y="581">sqlv_check_sql</text>
      <text x="770" y="645">sqlv_mapper_check</text>
      <text x="770" y="709">sqlv_rollback_plan</text>
      <text x="770" y="773">sqlv_perf_advice</text>
    </g>
    <g font-size="19.5" fill="#64748b">
      <text x="770" y="606">写风险与类型核查</text>
      <text x="770" y="670">mapper 契约核查</text>
      <text x="770" y="734">回滚预案（不执行）</text>
      <text x="770" y="798">性能建议（20 条规则）</text>
    </g>

    <!-- ================= 页脚 ================= -->
    <text x="540" y="920" text-anchor="middle" font-size="17" fill="#94a3b8">IDEA 2025.2+ 内置 MCP Server（无需另装）· 设置页可逐项启停，变更即时生效免重启</text>
  </g>
</svg>
