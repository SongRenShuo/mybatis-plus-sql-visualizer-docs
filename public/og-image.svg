<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 装饰圆 -->
  <circle cx="1050" cy="150" r="300" fill="rgba(37,99,235,0.08)"/>
  <circle cx="150" cy="500" r="200" fill="rgba(124,58,237,0.08)"/>
  <!-- Logo -->
  <rect x="80" y="245" width="140" height="140" rx="28" fill="url(#accent)"/>
  <ellipse cx="150" cy="290" rx="28" ry="8" fill="rgba(255,255,255,0.2)"/>
  <path d="M122 290 V320 A28 8 0 0 0 178 320 V290" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <rect x="115" y="345" width="70" height="22" rx="5" fill="rgba(0,0,0,0.2)"/>
  <text x="150" y="361" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="rgba(255,255,255,0.9)">SQL</text>
  <!-- 标题 -->
  <text x="260" y="290" font-family="system-ui, sans-serif" font-size="56" font-weight="700" fill="#f8fafc">SQL Visualizer</text>
  <text x="260" y="350" font-family="system-ui, sans-serif" font-size="28" fill="#94a3b8">Wrapper 链、XML/注解/HQL 动态 SQL 实时预览</text>
  <text x="260" y="395" font-family="system-ui, sans-serif" font-size="28" fill="#94a3b8">控制台日志一键还原，SQL 反向转 Java 代码</text>
  <!-- 代码块 -->
  <rect x="260" y="440" width="700" height="140" rx="12" fill="rgba(30,41,59,0.8)" stroke="rgba(51,65,85,0.5)"/>
  <text x="290" y="478" font-family="monospace" font-size="18" fill="#60a5fa">SELECT</text>
  <text x="370" y="478" font-family="monospace" font-size="18" fill="#e2e8f0">id, station_id, share_scheme_id</text>
  <text x="290" y="512" font-family="monospace" font-size="18" fill="#60a5fa">FROM</text>
  <text x="350" y="512" font-family="monospace" font-size="18" fill="#e2e8f0">device_info</text>
  <text x="290" y="546" font-family="monospace" font-size="18" fill="#60a5fa">WHERE</text>
  <text x="365" y="546" font-family="monospace" font-size="18" fill="#e2e8f0">id = 1001 AND station_id IS NOT NULL</text>
  <!-- 标签 -->
  <rect x="260" y="600" width="120" height="28" rx="14" fill="rgba(37,99,235,0.2)" stroke="rgba(37,99,235,0.4)"/>
  <text x="320" y="620" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#60a5fa">11 种方言</text>
  <rect x="395" y="600" width="130" height="28" rx="14" fill="rgba(16,185,129,0.2)" stroke="rgba(16,185,129,0.4)"/>
  <text x="460" y="620" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#34d399">610+ 测试</text>
  <rect x="540" y="600" width="120" height="28" rx="14" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)"/>
  <text x="600" y="620" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#a78bfa">MPJ 联表</text>
</svg>
