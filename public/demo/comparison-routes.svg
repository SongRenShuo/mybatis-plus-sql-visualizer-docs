<svg xmlns="http://www.w3.org/2000/svg" width="880" height="880" viewBox="0 0 880 880">
  <title>两条路线，同一个出口：静态预览（不启动项目）与日志还原（增强捕获为默认通道、控制台还原为回落通道）</title>
  <desc>左：两条路线各自的取数方式与形态；右：SQL Visualizer 统一还原出口；底部横条：三类落地场景。</desc>
  <!-- 口径：两条路线（静态预览 / 日志还原）；日志还原含两条通道（增强捕获＝默认、控制台还原＝回落）。
       版式：两列 + 底部场景横条。画布 880 宽——站点把图显示在约 800px，原先 1280 画布会被缩到 62.5%，
       17px 的字实际只剩 10.6px；收窄到 880 后缩放比升到约 91%，图内文字接近 1:1。
       视觉：中性底 + 单一强调蓝 + 路线语义浅底；发丝边框 + 极淡阴影；层级靠字号/字重。 -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0.5 1 L 9 5 L 0.5 9 z" fill="#b6c2d1"/>
    </marker>
  </defs>

  <rect width="880" height="880" fill="url(#page)"/>
  <rect x="18" y="18" width="844" height="844" rx="18" fill="#ffffff" stroke="#e6ebf2"/>

  <g font-family="system-ui, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">

    <!-- ================= 标题区 ================= -->
    <text x="440" y="80" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">两条路线，同一个出口</text>
    <text x="440" y="110" text-anchor="middle" font-size="15.5" fill="#64748b">静态预览（不启动项目）· 日志还原（应用跑起来之后）—— 两条路线，一套还原能力</text>

    <!-- ================= 左列：两条路线 ================= -->
    <text x="48" y="146" font-size="12.5" font-weight="600" fill="#94a3b8" letter-spacing="1.5">两条路线</text>
    <rect x="48" y="160" width="372" height="470" rx="14" fill="#f8fafc" stroke="#e8edf4"/>

    <!-- ① 静态预览 -->
    <g filter="url(#soft)">
      <rect x="62" y="174" width="344" height="136" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="86" cy="200" r="11" fill="#2563eb"/>
      <text x="86" y="204.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
      <text x="106" y="206" font-size="18.5" font-weight="600" fill="#0f172a">静态预览</text>
      <rect x="252" y="189" width="142" height="22" rx="11" fill="#eff6ff"/>
      <text x="323" y="204" text-anchor="middle" font-size="12.5" fill="#2563eb">不启动项目 · 不连库</text>
      <text x="86" y="246" font-size="16" fill="#334155">Wrapper 链 · XML · 注解 SQL</text>
      <text x="86" y="272" font-size="16" fill="#334155">JPA 派生方法 · CRUD 写路径 · JPQL</text>
      <text x="86" y="298" font-size="16" fill="#334155">MPJ 联表 · 其他 ORM 链式框架</text>
    </g>

    <!-- ② 日志还原（含两条通道） -->
    <g filter="url(#soft)">
      <rect x="62" y="320" width="344" height="300" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="86" cy="346" r="11" fill="#7c3aed"/>
      <text x="86" y="350.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
      <text x="106" y="352" font-size="18.5" font-weight="600" fill="#0f172a">日志还原</text>
      <rect x="282" y="335" width="112" height="22" rx="11" fill="#f5f3ff"/>
      <text x="338" y="350" text-anchor="middle" font-size="12.5" fill="#7c3aed">应用跑起来之后</text>

      <!-- 通道 A：增强捕获（默认） -->
      <rect x="78" y="370" width="312" height="120" rx="9" fill="#faf8ff" stroke="#e4ddfb"/>
      <rect x="92" y="384" width="46" height="20" rx="10" fill="#7c3aed"/>
      <text x="115" y="398" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">默认</text>
      <text x="148" y="399" font-size="15.5" font-weight="600" fill="#4c1d95">增强捕获</text>
      <text x="92" y="428" font-size="14.5" fill="#475569">本机 JVM · JDBC 层采集，免开应用日志</text>
      <text x="92" y="450" font-size="14.5" fill="#475569">真实参数 · 耗时 · 影响行数</text>
      <text x="92" y="472" font-size="14.5" fill="#475569">自带调用栈与源码位置</text>

      <!-- 通道 B：控制台还原（回落） -->
      <rect x="78" y="502" width="312" height="110" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
      <rect x="92" y="516" width="46" height="20" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
      <text x="115" y="530" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748b">回落</text>
      <text x="148" y="531" font-size="15.5" font-weight="600" fill="#334155">控制台还原</text>
      <text x="92" y="560" font-size="13" fill="#475569">拼装 <tspan font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" fill="#0f172a">Preparing:</tspan> 与 <tspan font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" fill="#0f172a">Parameters:</tspan></text>
      <text x="92" y="584" font-size="14.5" fill="#475569">不改工程，面向已有日志</text>
    </g>

    <!-- 汇聚连接 -->
    <path d="M 420 242 C 438 242 434 300 452 312" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M 420 470 C 438 470 434 430 452 420" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- ================= 右列：统一出口 ================= -->
    <text x="452" y="146" font-size="12.5" font-weight="600" fill="#94a3b8" letter-spacing="1.5">统一出口</text>
    <g filter="url(#card)">
      <rect x="452" y="216" width="364" height="344" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="452" y="216" width="364" height="4" rx="2" fill="#3b82f6"/>
      <text x="634" y="274" text-anchor="middle" font-size="21" font-weight="700" fill="#1d4ed8">SQL Visualizer</text>
      <text x="634" y="298" text-anchor="middle" font-size="14" fill="#93b4f0">统一还原出口</text>
      <line x1="476" y1="322" x2="792" y2="322" stroke="#eaf1fe" stroke-width="2"/>
      <g fill="#3b82f6">
        <circle cx="486" cy="356" r="3.5"/>
        <circle cx="486" cy="398" r="3.5"/>
        <circle cx="486" cy="440" r="3.5"/>
        <circle cx="486" cy="482" r="3.5"/>
        <circle cx="486" cy="524" r="3.5"/>
      </g>
      <text x="500" y="361.5" font-size="15.5" fill="#334155">带真实参数的完整 SQL</text>
      <text x="500" y="403.5" font-size="15.5" fill="#334155">跳回源码位置 / 调用栈</text>
      <text x="500" y="445.5" font-size="15.5" fill="#334155">语法高亮 · 参数回填</text>
      <text x="500" y="487.5" font-size="15.5" fill="#334155">方言分页 · 执行计划</text>
      <text x="500" y="529.5" font-size="15.5" fill="#334155">历史落盘 · 导出对比</text>
      <text x="634" y="546" text-anchor="middle" font-size="13" fill="#94a3b8">两条路线共用同一套列表与弹窗</text>
    </g>

    <!-- ================= 底部：什么时候用 ================= -->
    <text x="48" y="666" font-size="12.5" font-weight="600" fill="#94a3b8" letter-spacing="1.5">什么时候用</text>
    <g filter="url(#soft)">
      <rect x="48" y="680" width="784" height="112" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <line x1="314" y1="700" x2="314" y2="772" stroke="#eef2f7"/>
      <line x1="564" y1="700" x2="564" y2="772" stroke="#eef2f7"/>
    </g>
    <text x="72" y="712" font-size="16" font-weight="600" fill="#0f172a">写代码时确认逻辑</text>
    <text x="72" y="740" font-size="14" fill="#475569">光标压在链上即出 SQL，不必等容器</text>
    <rect x="72" y="754" width="68" height="20" rx="10" fill="#eff6ff"/>
    <text x="106" y="768" text-anchor="middle" font-size="12.5" fill="#2563eb">静态预览</text>
    <text x="322" y="712" font-size="16" font-weight="600" fill="#0f172a">联调与线上排查</text>
    <text x="322" y="740" font-size="14" fill="#475569">按请求聚焦 · 慢查询标红</text>
    <rect x="322" y="754" width="68" height="20" rx="10" fill="#f5f3ff"/>
    <text x="356" y="768" text-anchor="middle" font-size="12.5" fill="#7c3aed">日志还原</text>
    <text x="572" y="712" font-size="16" font-weight="600" fill="#0f172a">回归与留档</text>
    <text x="572" y="740" font-size="14" fill="#475569">历史落盘 · 两条 SQL 直接对比</text>
    <rect x="572" y="754" width="68" height="20" rx="10" fill="#f1f5f9"/>
    <text x="606" y="768" text-anchor="middle" font-size="12.5" fill="#64748b">两条皆可</text>

    <!-- ================= 页脚注解 ================= -->
    <line x1="48" y1="812" x2="832" y2="812" stroke="#eef2f7"/>
    <text x="440" y="838" text-anchor="middle" font-size="15" fill="#64748b">两条路线不互斥：写代码时走静态预览；要看实际执行就挂增强捕获，控制台还原是不改工程的回落通道</text>
  </g>
</svg>
