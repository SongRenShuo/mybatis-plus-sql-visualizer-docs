<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920">
  <!-- SQL Visualizer 三条取数路线示意图（guide/comparison「两条路线的定位差异」节） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#e8f1ff"/>
    </linearGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1280" height="920" fill="url(#bg)"/>
  <rect x="24" y="24" width="1232" height="872" rx="16" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- 标题 -->
  <text x="640" y="84" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="36" font-weight="700" fill="#1e293b">三条路线的定位差异</text>
  <text x="640" y="122" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="19" fill="#64748b">静态解析 · 运行期捕获 · 控制台还原 —— 三条来路，一个出口</text>

  <g font-family="system-ui, 'Segoe UI', sans-serif">

    <!-- ============ 左：三条来路 ============ -->
    <text x="90" y="186" font-size="17" font-weight="600" fill="#94a3b8">三条来路</text>

    <!-- ① 静态解析 -->
    <g filter="url(#ds)">
      <rect x="84" y="206" width="336" height="146" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="116" cy="240" r="9" fill="#2563eb"/>
      <text x="116" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
      <text x="136" y="246" font-size="20" font-weight="600" fill="#1e293b">静态解析</text>
      <text x="106" y="282" font-size="16" fill="#475569">Wrapper 链 / mapper XML</text>
      <text x="106" y="308" font-size="16" fill="#475569">JPA 派生方法 · 注解 SQL</text>
      <rect x="106" y="320" width="196" height="24" rx="12" fill="#eff6ff"/>
      <text x="204" y="337" text-anchor="middle" font-size="13" fill="#2563eb">不启动项目 · 不连数据库</text>
    </g>

    <!-- ② 运行期捕获 -->
    <g filter="url(#ds)">
      <rect x="84" y="372" width="336" height="146" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="116" cy="406" r="9" fill="#2563eb"/>
      <text x="116" y="411" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
      <text x="136" y="412" font-size="20" font-weight="600" fill="#1e293b">运行期捕获</text>
      <text x="106" y="448" font-size="16" fill="#475569">本机应用 JVM · JDBC 层</text>
      <text x="106" y="474" font-size="16" fill="#475569">增强捕获，免应用开日志</text>
      <rect x="106" y="486" width="230" height="24" rx="12" fill="#eff6ff"/>
      <text x="221" y="503" text-anchor="middle" font-size="13" fill="#2563eb">真实参数 · 耗时 · 影响行数</text>
    </g>

    <!-- ③ 控制台还原 -->
    <g filter="url(#ds)">
      <rect x="84" y="538" width="336" height="146" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="116" cy="572" r="9" fill="#94a3b8"/>
      <text x="116" y="577" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
      <text x="136" y="578" font-size="20" font-weight="600" fill="#1e293b">控制台还原</text>
      <text x="106" y="614" font-size="16" fill="#475569">Preparing: / Parameters:</text>
      <text x="106" y="640" font-size="16" fill="#475569">不改工程的回落通道</text>
      <rect x="106" y="652" width="168" height="24" rx="12" fill="#f1f5f9"/>
      <text x="190" y="669" text-anchor="middle" font-size="13" fill="#64748b">面向已有日志</text>
    </g>

    <!-- 汇聚箭头 -->
    <path d="M 428 279 C 470 279 470 420 508 420" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
    <path d="M 428 445 L 508 445" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
    <path d="M 428 611 C 470 611 470 470 508 470" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

    <!-- ============ 中：统一出口 ============ -->
    <g filter="url(#ds)">
      <rect x="516" y="256" width="272" height="382" rx="16" fill="url(#core)" stroke="#bfdbfe" stroke-width="1.5"/>
      <text x="652" y="302" text-anchor="middle" font-size="24" font-weight="700" fill="#1d4ed8">SQL Visualizer</text>
      <text x="652" y="328" text-anchor="middle" font-size="14" fill="#60a5fa">统一还原出口</text>
      <line x1="552" y1="348" x2="752" y2="348" stroke="#dbeafe" stroke-width="2"/>
      <circle cx="562" cy="386" r="4" fill="#3b82f6"/>
      <text x="580" y="392" font-size="16" fill="#1e293b">带真实参数的完整 SQL</text>
      <circle cx="562" cy="428" r="4" fill="#3b82f6"/>
      <text x="580" y="434" font-size="16" fill="#1e293b">跳回源码位置 / 调用栈</text>
      <circle cx="562" cy="470" r="4" fill="#3b82f6"/>
      <text x="580" y="476" font-size="16" fill="#1e293b">语法高亮 · 参数回填</text>
      <circle cx="562" cy="512" r="4" fill="#3b82f6"/>
      <text x="580" y="518" font-size="16" fill="#1e293b">方言分页 · EXPLAIN 计划</text>
      <circle cx="562" cy="554" r="4" fill="#3b82f6"/>
      <text x="580" y="560" font-size="16" fill="#1e293b">历史落盘 · 导出 / 对比</text>
      <text x="652" y="604" text-anchor="middle" font-size="13" fill="#64748b">三路共用同一套列表与弹窗</text>
    </g>

    <!-- 出口箭头 -->
    <path d="M 796 447 L 866 447" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

    <!-- ============ 右：拿到什么 ============ -->
    <text x="872" y="186" font-size="17" font-weight="600" fill="#94a3b8">拿到什么</text>

    <g filter="url(#ds)">
      <rect x="866" y="206" width="330" height="146" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="886" y="248" font-size="19" font-weight="600" fill="#1e293b">写代码时确认逻辑</text>
      <text x="886" y="284" font-size="16" fill="#475569">光标停在链上即出 SQL</text>
      <text x="886" y="310" font-size="16" fill="#475569">不必等 Spring 容器起来</text>
      <rect x="886" y="322" width="180" height="24" rx="12" fill="#eff6ff"/>
      <text x="976" y="339" text-anchor="middle" font-size="13" fill="#2563eb">静态解析路线</text>
    </g>

    <g filter="url(#ds)">
      <rect x="866" y="372" width="330" height="146" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="886" y="414" font-size="19" font-weight="600" fill="#1e293b">联调／线上排查</text>
      <text x="886" y="450" font-size="16" fill="#475569">按请求聚焦 · 慢查询排序</text>
      <text x="886" y="476" font-size="16" fill="#475569">屏蔽心跳噪声</text>
      <rect x="886" y="488" width="196" height="24" rx="12" fill="#eff6ff"/>
      <text x="984" y="505" text-anchor="middle" font-size="13" fill="#2563eb">运行期捕获路线</text>
    </g>

    <g filter="url(#ds)">
      <rect x="866" y="538" width="330" height="146" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="886" y="580" font-size="19" font-weight="600" fill="#1e293b">回归与留档</text>
      <text x="886" y="616" font-size="16" fill="#475569">历史自动落盘 · 正则检索</text>
      <text x="886" y="642" font-size="16" fill="#475569">两条历史 SQL 直接对比</text>
      <rect x="886" y="654" width="164" height="24" rx="12" fill="#f1f5f9"/>
      <text x="968" y="671" text-anchor="middle" font-size="13" fill="#64748b">三路皆可</text>
    </g>

    <!-- 底部注解 -->
    <line x1="84" y1="740" x2="1196" y2="740" stroke="#e2e8f0"/>
    <text x="640" y="782" text-anchor="middle" font-size="17" fill="#64748b">三条路线不互斥：默认走静态解析；要看实际执行就挂增强捕获，控制台还原作为不改工程的回落</text>
    <text x="640" y="816" text-anchor="middle" font-size="15" fill="#94a3b8">三者还原出的 SQL 进入同一套列表 / 历史 / 导出能力，操作习惯一致</text>
  </g>
</svg>
