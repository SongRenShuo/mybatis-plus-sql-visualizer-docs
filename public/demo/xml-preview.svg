  <text x="400" y="185" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#1E9FFF">XML 预览</text>
  <text x="400" y="220" text-anchor="middle" font-family="monospace" font-size="18" fill="#e6edf3">&lt;if test="id != null"&gt;</text>
