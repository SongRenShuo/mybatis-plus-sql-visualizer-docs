<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920">
  <title>SQL Visualizer · MCP Server：十一个只读工具按 agent 工作流分三组——拿 SQL、看库、执行前把关</title>
  <desc>外部 agent（Claude Code / Cursor / JetBrains AI Assistant / Codex）经 MCP 连到 IDEA 内置 MCP Server，调用插件注册的十一个 sqlv_* 工具。</desc>
  <!-- SQL Visualizer MCP Server 官方配图（2026-10-12 按 comparison-routes 视觉语言重绘；用于 features/mcp.md 中英两页）
       口径来源：features/mcp.md（十一工具 5/2/4 分组、只读幂等非破坏性、查询白名单只收 SELECT、
       全程零弹窗、审计留痕 [MCP-AUDIT]、IDEA 2025.2+ 内置 MCP Server）。
       视觉：与 comparison-routes.svg 同一套语言——中性底 + 分组语义色 + 发丝边框 + 极淡投影。 -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0.5 1 L 9 5 L 0.5 9 z" fill="#b6c2d1"/>
    </marker>
  </defs>

  <rect width="1280" height="920" fill="url(#page)"/>
  <rect x="24" y="24" width="1232" height="872" rx="20" fill="#ffffff" stroke="#e6ebf2"/>

  <g font-family="system-ui, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">

    <!-- ================= 标题区 ================= -->
    <text x="640" y="88" text-anchor="middle" font-size="35" font-weight="700" fill="#0f172a">SQL Visualizer · MCP Server</text>
    <text x="640" y="126" text-anchor="middle" font-size="17.5" fill="#64748b">给 AI Agent 的确定性 SQL 工具 —— 证据而非置信度</text>

    <!-- ================= 连接条：外部 agent → MCP → IDE 内置 Server ================= -->
    <text x="64" y="180" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="1.5">连接方式</text>

    <!-- 外部 agent -->
    <g filter="url(#soft)">
      <rect x="64" y="196" width="316" height="132" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    </g>
    <text x="86" y="228" font-size="15" font-weight="600" fill="#334155">外部 AGENT</text>
    <g font-size="14" fill="#475569">
      <circle cx="94" cy="256" r="5" fill="#d97757"/><text x="108" y="261">Claude Code</text>
      <circle cx="94" cy="284" r="5" fill="#2563eb"/><text x="108" y="289">Cursor</text>
      <circle cx="240" cy="256" r="5" fill="#8b5cf6"/><text x="254" y="261">AI Assistant</text>
      <circle cx="240" cy="284" r="5" fill="#10a37f"/><text x="254" y="289">Codex</text>
    </g>

    <!-- MCP 官方标识（modelcontextprotocol.io favicon 同款：黑底白色连接链路） -->
    <g filter="url(#soft)">
      <svg x="404" y="228" width="64" height="64" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="180" height="180" rx="24" fill="black"/>
        <mask id="mcp-official-mask" style="mask-type:luminance" maskUnits="userSpaceOnUse" x="7" y="7" width="166" height="166">
          <path d="M173 7H7V173H173V7Z" fill="white"/>
        </mask>
        <g mask="url(#mcp-official-mask)">
          <path d="M23.5996 85.2532L86.2021 22.6507C94.8457 14.0071 108.86 14.0071 117.503 22.6507C126.147 31.2942 126.147 45.3083 117.503 53.9519L70.2254 101.23" stroke="white" stroke-width="11.0667" stroke-linecap="round"/>
          <path d="M70.8789 100.578L117.504 53.952C126.148 45.3083 140.163 45.3083 148.806 53.952L149.132 54.278C157.776 62.9216 157.776 76.9357 149.132 85.5792L92.5139 142.198C89.6327 145.079 89.6327 149.75 92.5139 152.631L104.14 164.257" stroke="white" stroke-width="11.0667" stroke-linecap="round"/>
          <path d="M101.853 38.3013L55.553 84.6011C46.9094 93.2447 46.9094 107.258 55.553 115.902C64.1966 124.546 78.2106 124.546 86.8543 115.902L133.154 69.6025" stroke="white" stroke-width="11.0667" stroke-linecap="round"/>
        </g>
      </svg>
    </g>
    <text x="436" y="312" text-anchor="middle" font-size="13.5" font-weight="600" fill="#64748b">MCP</text>

    <!-- IDE 内置 Server -->
    <g filter="url(#soft)">
      <rect x="492" y="196" width="724" height="132" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="492" y="196" width="724" height="4" rx="2" fill="#3b82f6"/>
    </g>
    <text x="516" y="228" font-size="15" font-weight="600" fill="#334155">IntelliJ IDEA 2025.2+ 内置 MCP Server</text>
    <text x="516" y="254" font-size="14" fill="#475569">SQL Visualizer 插件注册 <tspan font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" fill="#1d4ed8">sqlv_*</tspan> 十一个工具，agent 直接调用；IDE 里照常写代码，两边互不打扰</text>
    <g font-size="13" fill="#2563eb">
      <rect x="516" y="272" width="96" height="23" rx="11.5" fill="#eff6ff"/><text x="564" y="288" text-anchor="middle">只读 · 幂等</text>
      <rect x="620" y="272" width="150" height="23" rx="11.5" fill="#eff6ff"/><text x="695" y="288" text-anchor="middle">非破坏性声明</text>
      <rect x="778" y="272" width="184" height="23" rx="11.5" fill="#eff6ff"/><text x="870" y="288" text-anchor="middle">查询白名单（只收 SELECT）</text>
      <rect x="970" y="272" width="96" height="23" rx="11.5" fill="#eff6ff"/><text x="1018" y="288" text-anchor="middle">全程零弹窗</text>
      <rect x="1074" y="272" width="118" height="23" rx="11.5" fill="#eff6ff"/><text x="1133" y="288" text-anchor="middle">审计留痕</text>
    </g>

    <!-- 连接箭头 -->
    <path d="M 380 262 L 400 262" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M 468 262 L 488 262" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- ================= 工具三组 ================= -->
    <text x="64" y="366" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="1.5">十一个工具 · 按 agent 工作流分组</text>

    <!-- ① 拿 SQL -->
    <g filter="url(#card)">
      <rect x="64" y="382" width="388" height="392" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    </g>
    <circle cx="90" cy="414" r="6" fill="#2563eb"/>
    <text x="108" y="420" font-size="19" font-weight="600" fill="#0f172a">拿 SQL</text>
    <rect x="392" y="401" width="38" height="24" rx="12" fill="#eff6ff"/>
    <text x="411" y="418" text-anchor="middle" font-size="13.5" font-weight="600" fill="#2563eb">5</text>
    <g font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="15.5" font-weight="600" fill="#1d4ed8">
      <text x="90" y="462">sqlv_render_sql</text>
      <text x="90" y="524">sqlv_render_logs</text>
      <text x="90" y="586">sqlv_crud_sql</text>
      <text x="90" y="648">sqlv_reverse_sql</text>
      <text x="90" y="710">sqlv_history_search</text>
    </g>
    <g font-size="13.5" fill="#64748b">
      <text x="90" y="484">文件 + 行号 / XML 片段 → 可执行 SQL</text>
      <text x="90" y="546">控制台日志还原真实参数 SQL</text>
      <text x="90" y="608">实体类 → INSERT / UPDATE / SELECT / DELETE</text>
      <text x="90" y="670">一条 SQL → MyBatis-Plus Java 代码</text>
      <text x="90" y="732">历史落盘 SQL 四维检索</text>
    </g>

    <!-- ② 看库 -->
    <g filter="url(#card)">
      <rect x="464" y="382" width="352" height="392" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    </g>
    <circle cx="490" cy="414" r="6" fill="#0284c7"/>
    <text x="508" y="420" font-size="19" font-weight="600" fill="#0f172a">看库</text>
    <rect x="756" y="401" width="38" height="24" rx="12" fill="#e0f2fe"/>
    <text x="775" y="418" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0284c7">2</text>
    <g font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="15.5" font-weight="600" fill="#0369a1">
      <text x="490" y="462">sqlv_schema_context</text>
      <text x="490" y="524">sqlv_explain</text>
    </g>
    <g font-size="13.5" fill="#64748b">
      <text x="490" y="484">表名清单 → 真实表列结构 / 类型 / 注释</text>
      <text x="490" y="546">单条 SELECT → 按方言派发 EXPLAIN 计划</text>
    </g>
    <text x="490" y="600" font-size="13" fill="#94a3b8">连库类工具需已配置数据源</text>

    <!-- ③ 执行前把关 -->
    <g filter="url(#card)">
      <rect x="828" y="382" width="388" height="392" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    </g>
    <circle cx="854" cy="414" r="6" fill="#059669"/>
    <text x="872" y="420" font-size="19" font-weight="600" fill="#0f172a">执行前把关</text>
    <rect x="1156" y="401" width="38" height="24" rx="12" fill="#ecfdf5"/>
    <text x="1175" y="418" text-anchor="middle" font-size="13.5" font-weight="600" fill="#059669">4</text>
    <g font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="15.5" font-weight="600" fill="#047857">
      <text x="854" y="462">sqlv_check_sql</text>
      <text x="854" y="524">sqlv_mapper_check</text>
      <text x="854" y="586">sqlv_rollback_plan</text>
      <text x="854" y="648">sqlv_perf_advice</text>
    </g>
    <g font-size="13.5" fill="#64748b">
      <text x="854" y="484">静态写风险与类型核查</text>
      <text x="854" y="546">mapper 契约核查（simulate 可带写风险/性能分析）</text>
      <text x="854" y="608">回滚预案 —— 只产出，不执行任何语句</text>
      <text x="854" y="670">按 20 条规则给性能建议</text>
    </g>

    <!-- ================= 页脚 ================= -->
    <line x1="64" y1="812" x2="1216" y2="812" stroke="#eef2f7"/>
    <text x="640" y="844" text-anchor="middle" font-size="15.5" fill="#64748b">十一个工具全部向 agent 显式声明只读、幂等、非破坏性；不合规请求以错误消息返回，不在 IDE 里弹框打断你</text>
    <text x="640" y="874" text-anchor="middle" font-size="13.5" fill="#94a3b8">IDEA 2025.2+ 内置 MCP Server（无需另装）· 设置页可逐项启停，变更即时生效免重启 · 每次调用写一条 [MCP-AUDIT] 审计记录</text>
  </g>
</svg>
